name: Extract project zip
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip if present
        run: |
          if [ -f dz-store.zip ]; then
            unzip -o dz-store.zip -d extracted
            echo "--- Extracted top-level contents ---"
            ls -la extracted
            EXTRACTED_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
            echo "Detected folder: $EXTRACTED_DIR"
            shopt -s dotglob
            mv "$EXTRACTED_DIR"/* .
            rm -rf extracted dz-store.zip
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Extract project files from zip" || echo "Nothing to commit"
            git push
          else
            echo "No zip file found, skipping."
          fi
